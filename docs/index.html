<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COTA CEA$A - Preços CEASA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#0a1f13">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Verde e amarelo da bandeira do Brasil
                        verde:  { DEFAULT: '#12B24A', claro: '#3BD777', escuro: '#0B8A3B' },
                        ouro:   { DEFAULT: '#FFDF00', escuro: '#E6C700', borda: '#9A7D00' },   /* amarelo da bandeira do Brasil: único do app */
                        // Fundos escuros com um leve tom de verde
                        mata:   { 950: '#05120b', 900: '#0a1f13', 800: '#12301e', 700: '#1c4630' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // tema escolhido (claro/escuro) aplicado antes de desenhar a página, sem "piscar"
        try { if (localStorage.getItem('cc-tema') === 'claro') document.documentElement.classList.add('claro'); } catch (e) {}
    </script>
    <style>
        /* ---------- tema claro: troca as cores escuras por claras ---------- */
        html.claro .bg-black { background-color: #e5e9e6; }
        html.claro .bg-mata-950 { background-color: #f6f9f7; }
        html.claro .bg-mata-900 { background-color: #ffffff; }
        html.claro .bg-mata-800, html.claro .hover\:bg-mata-800:hover { background-color: #edf3ef; }
        html.claro .hover\:bg-mata-700:hover { background-color: #e1ebe4; }
        html.claro .border-mata-800 { border-color: #e1e8e3; }
        html.claro .border-mata-700 { border-color: #cbd7cf; }
        html.claro .text-white, html.claro .text-slate-100 { color: #0f172a; }
        html.claro .text-slate-200 { color: #1e293b; }
        html.claro .text-slate-300 { color: #334155; }
        html.claro .text-slate-400 { color: #475569; }
        html.claro .text-slate-500 { color: #64748b; }
        html.claro .hover\:text-white:hover { color: #000; }
        html.claro .text-verde-claro { color: #0b8a3b; }
        /* amarelo sobre fundo claro: texto e ícones ganham contorno de 1px mais escuro */
        html.claro .text-ouro, html.claro .text-ouro\/70, html.claro .text-ouro\/90, html.claro .hover\:text-ouro:hover {
            color: #FFDF00; text-shadow: -1px 0 #9A7D00, 1px 0 #9A7D00, 0 -1px #9A7D00, 0 1px #9A7D00; }
        html.claro .text-ouro svg, html.claro .text-ouro\/70 svg, html.claro .text-ouro\/90 svg,
        html.claro svg [fill="#FFDF00" i], html.claro svg [stroke="#FFDF00" i] {
            filter: drop-shadow(1px 0 0 #9A7D00) drop-shadow(-1px 0 0 #9A7D00) drop-shadow(0 1px 0 #9A7D00) drop-shadow(0 -1px 0 #9A7D00); }
        html.claro .bg-ouro\/10 { background-color: rgba(255, 223, 0, .14); }
        html.claro .hover\:bg-ouro\/10:hover, html.claro .hover\:bg-ouro\/20:hover { background-color: rgba(255, 223, 0, .3); }
        html.claro .border-ouro\/30, html.claro .border-ouro\/40, html.claro .border-ouro\/60 { border-color: #9A7D00; }
        html.claro .text-rose-300, html.claro .text-rose-400 { color: #e11d48; }
        html.claro .shadow-black { --tw-shadow-color: rgba(0, 0, 0, .12); }
        html.claro .bg-ouro .text-ouro, html.claro .bg-ouro.text-ouro { color: #0b8a3b; text-shadow: none; }
        html.claro .bg-verde.text-white { color: #fff; }
        html.claro .shadow-black\/40 { --tw-shadow-color: rgba(0, 0, 0, .15); }
        html.claro svg circle[stroke="#0a1f13"] { stroke: #fff; }
        /* gráfico (cores fixas no SVG) */
        html.claro svg line[stroke="#1c4630"] { stroke: #e2e8f0; }
        html.claro svg [fill="#94a3b8"] { fill: #64748b; }
        html.claro svg [stroke="#3BD777"] { stroke: #0b8a3b; }
        html.claro svg [fill="#3BD777"] { fill: #0b8a3b; }
        html.claro svg circle[stroke="#0a1f13"] { stroke: #fff; }
        /* quadro do gráfico anualizado: sempre escuro (o amarelo-neon e os verdes claros somem no branco) */
        html.claro .sempre-escuro { background-color: #0a1f13; border-color: #12301e; }
        html.claro .sempre-escuro .text-white { color: #fff; }
        html.claro .sempre-escuro .text-slate-200 { color: #e2e8f0; }
        html.claro .sempre-escuro .text-slate-400 { color: #94a3b8; }
        html.claro .sempre-escuro .text-slate-500 { color: #64748b; }
        html.claro .sempre-escuro .border-mata-700 { border-color: #1c4630; }
        html.claro .sempre-escuro .border-mata-800 { border-color: #12301e; }
        html.claro .sempre-escuro svg line[stroke="#1c4630"] { stroke: #1c4630; }
        html.claro .sempre-escuro svg [fill="#94a3b8"] { fill: #94a3b8; }
        html.claro .sempre-escuro .hover\:bg-mata-800:hover { background-color: #12301e; }
        html.claro .sempre-escuro .text-ouro, html.claro .sempre-escuro .text-ouro\/70, html.claro .sempre-escuro .text-ouro\/90 { text-shadow: none; }
        html.claro .sempre-escuro svg, html.claro .sempre-escuro svg [fill="#FFDF00" i], html.claro .sempre-escuro svg [stroke="#FFDF00" i] { filter: none; }
        /* ícones de apoio dos campos (setas, lupa, calendário): no claro, verde escuro do app em vez de amarelo */
        html.claro .ico-campo { color: #0B8A3B !important; text-shadow: none !important; }
        /* link em amarelo = botão amarelo com texto preto (padrão do app, nos dois temas) */
        .botao-ouro { background-color: #FFDF00 !important; color: #000 !important; border: 1px solid #E6C700 !important;
            text-decoration: none !important; text-shadow: none !important; }
        .botao-ouro:hover { background-color: #E6C700 !important; }
        a.botao-ouro { display: inline-block; padding: .05rem .5rem; border-radius: .5rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-black text-slate-100 min-h-screen font-sans antialiased">
<!-- Moldura de celular: o app sempre usa a largura de uma tela de celular, mesmo no PC -->
<div id="app" class="w-full max-w-md mx-auto min-h-screen flex flex-col bg-mata-950 border-x border-mata-800 shadow-2xl shadow-black">

    <!-- Header principal -->
    <header class="bg-mata-900 sticky top-0 z-30 shadow-md">
        <div class="px-4 h-16 flex items-center justify-between">
            <!-- Logo: losango + círculo da bandeira, com o cifrão como marca -->
            <div class="flex items-center space-x-2.5 min-w-0">
                <svg viewBox="0 0 48 48" class="w-10 h-10 shrink-0" role="img" aria-label="Logo COTA CEA$A">
                    <rect width="48" height="48" rx="12" fill="#FFDF00"/>
                    <path d="M9 33 L18 23 L25 29 L37 14" fill="none" stroke="#0B8A3B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M28 13.5 H37.5 V23" fill="none" stroke="#0B8A3B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <div class="min-w-0">
                    <h1 class="text-[24px] font-black tracking-tight leading-none text-verde-claro whitespace-nowrap">COTA CEA<span class="text-ouro">$</span>A</h1>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <!-- Tema: sol = mudar para claro; lua = mudar para escuro -->
                <button onclick="alternarTema()" id="btn-tema" title="Fundo claro" aria-label="Alternar fundo claro/escuro" class="bg-mata-800 hover:bg-mata-700 border border-mata-700 text-ouro w-10 h-10 rounded-xl flex items-center justify-center shrink-0 transition-colors">
                    <i id="ico-tema" class="fa-solid fa-sun"></i>
                </button>
                <button onclick="abrirModalAuth('login')" id="btn-conta" title="Entrar" class="bg-ouro hover:bg-ouro-escuro text-mata-950 font-semibold w-10 h-10 rounded-xl text-sm transition-colors duration-200 flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-user"></i>
                </button>

                <!-- Favoritos: estrela vazada (inativo) / preenchida (filtro ligado) -->
                <button onclick="toggleFiltroFavoritos()" id="btn-fav-header" title="Meus Favoritos" aria-pressed="false" class="bg-mata-800 hover:bg-mata-700 border border-mata-700 text-ouro p-2.5 rounded-xl transition-all duration-200 flex items-center justify-center relative">
                    <svg id="ico-fav-header" viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.5l-5.9 3.2 1.2-6.6L2.5 9.5l6.6-.9z"/></svg>
                    <span id="fav-count-badge" class="absolute -top-1 -right-1 bg-ouro text-mata-950 text-[10px] font-extrabold w-4 h-4 rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
        <!-- Filete amarelo -->
        <div class="h-1 bg-ouro"></div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 w-full px-4 py-4">
        <section id="vista-lista" class="space-y-4">
        <!-- Filtros e busca: ficam presos logo abaixo do cabeçalho ao rolar a lista -->
        <div id="barra-filtros" class="flex flex-col items-stretch gap-3 sticky z-20 bg-mata-950 -mx-4 px-4 -mt-4 pt-4 pb-3 shadow-[0_8px_8px_-8px_rgba(0,0,0,.35)]" style="top: var(--topo, 72px)">
            <!-- Grupo de produtos e localidade: lado a lado, mesmo estilo -->
            <div id="filtros-lista" class="grid grid-cols-2 gap-3 transition-opacity">
                <div class="relative">
                    <select id="select-categoria" aria-label="Grupo de produtos" onchange="filtrarCategoria(this.value)" class="w-full appearance-none bg-mata-800 text-slate-200 text-sm font-medium rounded-xl border border-mata-700 pl-3.5 pr-9 py-2.5 focus:ring-2 focus:ring-ouro focus:outline-none cursor-pointer truncate">
                        <option value="todos">📦 Tipos de produtos</option>
                        <option value="frutas">🍎 Frutas</option>
                        <option value="folhosas">🥬 Folhosas</option>
                        <option value="legumes">🍅 Legumes</option>
                        <option value="raizes">🥔 Raízes e tubérculos</option>
                        <option value="temperos">🌿 Temperos</option>
                        <option value="ovos_graos">🥚 Ovos e grãos</option>
                        <option value="pescados">🐟 Pescados</option>
                        <option value="outros">🧺 Outros</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-ouro ico-campo text-xs pointer-events-none"></i>
                </div>

                <!-- Local: várias praças podem ser marcadas para comparar -->
                <div class="relative">
                    <button id="btn-mercado" type="button" onclick="abrirMercados(event)" aria-haspopup="true" aria-label="Locais" class="w-full text-left bg-mata-800 text-slate-200 text-sm font-medium rounded-xl border border-mata-700 pl-3.5 pr-9 py-2.5 focus:ring-2 focus:ring-ouro focus:outline-none cursor-pointer">
                        <span id="btn-mercado-rot" class="block truncate">📍 Local</span>
                    </button>
                    <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-ouro ico-campo text-xs pointer-events-none"></i>
                    <div id="pop-mercados" class="hidden absolute right-0 top-full mt-1.5 w-72 max-w-[calc(100vw-2rem)] z-40 bg-mata-900 border border-mata-700 rounded-xl shadow-xl shadow-black/40 p-1.5"></div>
                </div>
            </div>

            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-ouro ico-campo text-sm"></i>
                <input type="search" id="input-busca" oninput="filtrarProdutos()" placeholder="Buscar por produto (ex: Tomate, Batata...)" autocomplete="off" class="w-full bg-mata-950 border border-mata-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-ouro">
            </div>
        </div>

        <!-- Faixa de informação: data do boletim, contagem e filtro de favoritos -->
        <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400 px-1">
            <span id="info-boletim"><i class="fa-regular fa-calendar mr-1 text-ouro ico-campo"></i>Carregando cotações…</span>
            <div class="flex items-center gap-3">
                <button id="chip-fav" onclick="limparFiltros()" class="hidden items-center gap-1.5 botao-ouro rounded-full px-2.5 py-1 font-semibold transition-colors">
                    <i class="fa-solid fa-star"></i> Só favoritos <i class="fa-solid fa-xmark ml-0.5"></i>
                </button>
                <span id="info-contagem"></span>
            </div>
        </div>

        <div id="grid-produtos" class="grid grid-cols-1 gap-2"></div>
        <div id="estado-vazio" class="hidden text-center py-16 text-slate-400"></div>
        </section>

        <!-- Detalhe do produto: histórico no tempo, gráfico e previsão -->
        <section id="vista-detalhe" class="hidden space-y-4"></section>
    </main>

    <!-- Folha sobreposta: login e configurações -->
    <div id="folha" class="hidden fixed inset-0 z-50 bg-black/70" role="dialog" aria-modal="true">
        <div id="folha-conteudo" class="relative mx-auto w-full max-w-md h-full bg-mata-950 border-x border-mata-800 overflow-y-auto"></div>
    </div>

    <footer class="bg-mata-900 border-t border-mata-800 py-5 px-4 text-center text-xs text-slate-500">
        <p>2026 COTA CEA<span class="text-ouro">$</span>A</p>
    </footer>

    <!-- Banner de patrocínio: fixo na parte inferior da tela -->
    <div class="sticky bottom-0 z-30 bg-ouro text-mata-950 text-xs font-semibold py-2.5 px-4 shadow-[0_-4px_12px_rgba(0,0,0,0.4)]">
        <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-2 min-w-0">
                <span class="bg-verde text-white text-[10px] uppercase tracking-wider font-bold px-2 py-0.5 rounded shrink-0">Patrocinado</span>
                <span class="leading-tight">Insumos Agrícolas &amp; Adubos – descontos para feirantes e produtores!</span>
            </div>
            <a href="#" class="inline-flex items-center gap-1 font-bold underline hover:opacity-80 transition-opacity whitespace-nowrap shrink-0">
                <span>Ofertas</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </a>
        </div>
    </div>

    <script src="util.js"></script>
    <script src="grafico.js"></script>
    <script src="auth.js"></script>
    <script>
        // altura do cabeçalho -> posição dos filtros fixos
        const ajustarTopo = () => document.documentElement.style.setProperty('--topo', document.querySelector('header').offsetHeight + 'px');
        ajustarTopo(); addEventListener('resize', ajustarTopo);
    </script>
    <script src="anual.js"></script>
    <script src="app.js"></script>
    <script>
        function aplicarIconeTema() {
            const claro = document.documentElement.classList.contains('claro');
            document.getElementById('ico-tema').className = claro ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
            document.getElementById('btn-tema').title = claro ? 'Fundo escuro' : 'Fundo claro';
            document.querySelector('meta[name="theme-color"]').content = claro ? '#ffffff' : '#0a1f13';
        }
        function alternarTema() {
            const claro = document.documentElement.classList.toggle('claro');
            try { localStorage.setItem('cc-tema', claro ? 'claro' : 'escuro'); } catch (e) {}
            aplicarIconeTema();
        }
        aplicarIconeTema();
    </script>
</div>
</body>
</html>
