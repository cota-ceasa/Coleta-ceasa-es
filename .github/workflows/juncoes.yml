name: Junções de séries (listar / desfazer)

# Lista no resumo da execução todas as séries juntadas (quando uma acaba e outra começa).
# "desfazer" reverte as junções das séries marcadas em NAO_JUNTAR (coleta/juncao.py).
on:
  workflow_dispatch:
    inputs:
      desfazer:
        description: "Reverter as junções bloqueadas em NAO_JUNTAR antes de listar"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: coleta   # não roda junto com a coleta (mexem nas mesmas tabelas)
  cancel-in-progress: false

jobs:
  juncoes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python -m coleta.juncao ${{ inputs.desfazer && '--desfazer' || '' }}
