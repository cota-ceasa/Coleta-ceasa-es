name: Coleta CEASA

on:
  # AGENDAMENTO PAUSADO durante a carga do histórico (2023). Para reativar, descomente:
  # schedule:
  #   # todo dia, a cada 2 h das 06:00 às 22:00 de Brasília (UTC-3 = UTC 09:00-01:00)
  #   - cron: "0 9-23/2 * * *"
  #   - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      discover:
        description: "Inspecionar o formulário de uma CEASA (ex.: ES ou BH) em vez de coletar"
        required: false
        default: ""
      diagnostico:
        description: "Só testar se o GitHub consegue abrir os sites das CEASAs (computador x Android)"
        type: boolean
        default: false
      perfil:
        description: "Navegador simulado na coleta"
        type: choice
        options: [computador, android]
        default: computador
      inicio:
        description: "Coletar a partir desta data (AAAA-MM-DD). Vazio = últimos 30 dias"
        required: false
        default: ""
      max:
        description: "Máximo de boletins novos POR CEASA nesta execução (são 9 praças: use 40 ao carregar histórico)"
        required: false
        default: "60"
      limite_min:
        description: "Minutos baixando boletins antes de parar e publicar (máx. 330). Vazio = 100"
        required: false
        default: ""
      renormalizar:
        description: "Refazer a padronização dos boletins já baixados (sem baixar de novo)"
        type: boolean
        default: false
      juncoes_simular:
        description: "Só listar as séries que seriam juntadas por troca de nome (sem alterar o banco)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.limite_min != '' && inputs.limite_min != null && 360 || 120 }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Versão do Playwright
        id: pwv
        run: echo "v=$(python -c 'import importlib.metadata as m;print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache do navegador
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pwv.outputs.v }}

      - name: Instalar navegador
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Diagnóstico de acesso (opcional)
        if: ${{ inputs.diagnostico }}
        run: python -m coleta.run --diagnostico

      - name: Inspecionar formulário (opcional)
        if: ${{ inputs.discover != '' && !inputs.diagnostico }}
        run: python -m coleta.run --discover "${{ inputs.discover }}" --perfil "${{ inputs.perfil || 'computador' }}"

      - name: Coletar boletins
        if: ${{ inputs.discover == '' && !inputs.diagnostico }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
          LIMITE_MIN: ${{ inputs.limite_min || '100' }}   # job tem 120 min (360 se informado): sobra tempo p/ publicar
          INICIO: ${{ inputs.inicio }}
          JUNCOES: ${{ inputs.juncoes_simular && 'simular' || 'aplicar' }}
          MAXIMO: ${{ inputs.max }}
          RENORMALIZAR: ${{ inputs.renormalizar }}
          PERFIL: ${{ inputs.perfil }}
        run: |
          # RJ bloqueia os IPs do GitHub: roda no seu computador (coleta-local.yml)
          ARGS="--onde nuvem --max ${MAXIMO:-40} --perfil ${PERFIL:-computador}"
          if [ -n "$INICIO" ]; then ARGS="$ARGS --inicio $INICIO"; fi
          if [ "$RENORMALIZAR" = "true" ]; then ARGS="$ARGS --renormalizar"; fi
          python -m coleta.run $ARGS

      - name: Guardar boletins brutos e diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saida
          path: saida/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publicar app (GitHub Pages)
        if: ${{ inputs.discover == '' && !inputs.diagnostico }}
        uses: actions/configure-pages@v5

      - if: ${{ inputs.discover == '' && !inputs.diagnostico }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # O GitHub às vezes demora a "enxergar" o pacote recém-enviado ("No artifacts named
      # github-pages"). Espera um pouco antes de publicar e, se falhar, tenta mais uma vez.
      - if: ${{ inputs.discover == '' && !inputs.diagnostico }}
        run: sleep 15

      - id: deploy
        if: ${{ inputs.discover == '' && !inputs.diagnostico }}
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: ${{ steps.deploy.outcome == 'failure' }}
        run: sleep 60

      - id: deploy2
        if: ${{ steps.deploy.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
