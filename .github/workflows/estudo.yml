name: Estudo (extração de séries)

# Execução avulsa: imprime no log as séries de um produto, para estudos feitos fora do app.
on:
  workflow_dispatch:
    inputs:
      ceasa:
        description: "Praça (ex.: ES)"
        default: "ES"
      produto:
        description: "Produto padrão (ex.: Tangerina)"
        default: "Tangerina"

permissions:
  contents: read

jobs:
  estudo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Extrair
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m coleta.estudo "${{ inputs.ceasa }}" "${{ inputs.produto }}"
